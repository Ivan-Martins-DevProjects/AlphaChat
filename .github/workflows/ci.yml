name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main
      - release/**
  push:
    branches:
      - develop
      - release/**

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: server

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: server

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run tests
        run: npx ng test
        working-directory: client

  deploy:
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send webhook notification (main)
        if: github.ref == 'refs/heads/main'
        run: |
          curl --max-time 360 -s -X POST "${{ secrets.MAIN_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_AUTH_TOKEN }}" \
            -d '{"repository": "${{ github.repository }}", "branch": "main", "commit": "${{ github.sha }}", "status": "success", "event": "${{ github.event_name }}", "actor": "${{ github.actor }}"}'

      - name: Send webhook notification (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          curl --max-time 360 -v -X POST "${{ secrets.DEVELOP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_AUTH_TOKEN }}" \
            -d '{"repository": "${{ github.repository }}", "branch": "develop", "commit": "${{ github.sha }}", "status": "success", "event": "${{ github.event_name }}", "actor": "${{ github.actor }}"}'
