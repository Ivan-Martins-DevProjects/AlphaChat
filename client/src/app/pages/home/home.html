<div class="conversations">
	<app-conversations
		[tickets]="tickets"
		[isLoading]="isLoading"
		[isLoadingMore]="isLoadingMore"
		[hasMore]="hasMore"
		[currentUserId]="currentUserId"

	/>
	<app-chat-content
		[initialConversationId]="initialConversationId"
		(contactUpdated)="onContactUpdated()"
	/>
</div>
